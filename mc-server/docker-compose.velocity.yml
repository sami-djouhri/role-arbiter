# AKTIVE Variante (loest docker-compose.gate.yml ab): Velocity 4 + NanoLimbo + Connect vor Paper.
# Velocity 4 spricht MC 26.2 nativ -> nahtloser Limbo-Warteraum OHNE Backend-Downgrade (Weg B).
#   velocity   ALWAYS-ON  Proxy (~512M) + connect-velocity (Tunnel greenleaf.play.minekube.net) + LimboWake-Plugin
#   nanolimbo  ALWAYS-ON  Warteraum (~256M): haelt den Spieler verbunden waehrend survival bootet
#   mc         ON-DEMAND  Paper 26.2 (survival) — Start/Stop steuert der mc-arbiter (compose up/stop -d mc)
# Modern forwarding: alle drei teilen /opt/mc/velocity/forwarding.secret (NIE committen, Deploy erzeugt es).
# RCON-pw wird beim Deploy aus /opt/mc/.rcon in den mc-Service injiziert (Platzhalter __RCONPW__).
networks:
  mc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16          # explizit (Projektregel), statische IPs fuers Backend-Routing

services:
  velocity:
    image: itzg/mc-proxy:java25
    container_name: mc-velocity
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      mc-net: { ipv4_address: 172.30.0.2 }
    ports:
      - "192.0.2.10:25565:25565"       # LAN-Zugang; oeffentlich laeuft ueber den Connect-Outbound-Tunnel
    environment:
      TYPE: "VELOCITY"
      VELOCITY_VERSION: "4.1.0-SNAPSHOT"  # einzige 26.2-faehige Linie; Jar in ./velocity persistiert (gepinnt via .paper-Cache)
      MEMORY: "512M"
      TZ: "Europe/Berlin"
    volumes:
      - ./velocity:/server                # velocity.toml + forwarding.secret + plugins/ (connect-velocity, limbowake)

  nanolimbo:
    image: eclipse-temurin:21-jre
    container_name: mc-nanolimbo
    restart: unless-stopped
    working_dir: /work
    networks:
      mc-net: { ipv4_address: 172.30.0.4 }
    command: ["java", "-Xmx256M", "-jar", "NanoLimbo.jar"]
    volumes:
      - ./nanolimbo:/work                             # settings.yml + NanoLimbo.jar
      - ./velocity/forwarding.secret:/work/forwarding.secret:ro   # geteiltes modern-forwarding-Secret
    environment:
      TZ: "Europe/Berlin"

  mc:
    image: itzg/minecraft-server:java25   # Paper MC 26.2 braucht Java 25
    container_name: mc-poc
    stop_grace_period: 60s                # Paper sauber alle Welten speichern lassen (sonst SIGKILL=137 im Save)
    networks:
      mc-net: { ipv4_address: 172.30.0.3 }
    tty: true
    stdin_open: true
    restart: "no"                         # Orchestrator (mc-arbiter) steuert Start/Stop/Heilung
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      MEMORY: "2000M"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_PLAYERS: "8"
      ONLINE_MODE: "FALSE"                 # hinter Velocity modern forwarding -> Proxy authentifiziert, Paper vertraut ihm
      ENABLE_WHITELIST: "TRUE"             # Whitelist bleibt (forwarded echte UUIDs -> greift korrekt)
      ENABLE_RCON: "true"
      RCON_PASSWORD: "__RCONPW__"          # Platzhalter -> deploy aus /opt/mc/.rcon
      SPARK: "true"
      MODRINTH_PROJECTS: "chunky,multiverse-core"
      ENABLE_AUTOSTOP: "FALSE"             # Idle-/Lifecycle-Logik macht der Orchestrator, nicht itzg
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data
