# Velocity 4.x (config-version 2.8): Greenleaf on-demand MC-Netz (LXC 203 auf .18).
# Ersetzt Gate Lite: Velocity 4 spricht MC 26.2 nativ (ProtocolVersion enthaelt 26.1/26.2 verifiziert).
# ALWAYS-ON Proxy vor dem on-demand Paper-Backend (mc) + NanoLimbo (limbo, Warteraum).
# Oeffentlicher Zugang weiter via Minekube Connect (connect-velocity Plugin) -> greenleaf.play.minekube.net.
# forwarding.secret wird beim Deploy erzeugt (NIE committen) und mit Paper + NanoLimbo geteilt (modern forwarding).
config-version = "2.8"
# Proxy bindet auf 25565 (LAN-Publish nur 192.0.2.10:25565; oeffentlich laeuft ueber Connect-Outbound).
bind = "0.0.0.0:25565"
# Statische MOTD (on-demand: Backend schlaeft im Normalzustand -> ehrliche "wird gestartet"-Zeile).
motd = "<green><bold>Greenleaf</bold></green> <gray>: Beitreten startet den Server (~2 Min)</gray>"
show-max-players = 8
# Mojang-Auth am Proxy (Connect injiziert die authentifizierte Session -> Whitelist-UUIDs bleiben korrekt).
online-mode = true
# Connect-Spieler haben keinen signierten Chat-Key -> aus (sonst Kick). (= altes enforce-secure-profile=false)
force-key-authentication = false
prevent-client-proxy-connections = false
# Modern forwarding: Proxy reicht die verifizierte GameProfile+IP an die Backends (Paper/NanoLimbo).
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
# Statische Proxy-MOTD nutzen (nicht die des schlafenden Backends spiegeln).
ping-passthrough = "DISABLED"
enable-player-address-logging = true

[servers]
	# On-demand Paper-Backend (survival) + immer-wacher NanoLimbo-Warteraum (limbo).
	survival = "172.30.0.3:25565"
	limbo = "172.30.0.4:25565"
	# Beim Login/Fallback: erst survival; ist es aus (on-demand) -> limbo (Spieler bleibt verbunden,
	# NanoLimbo zeigt "wird gestartet", Wake wird ausgeloest). Das LimboWake-Plugin holt ihn nach
	# survival zurueck, sobald es hochgefahren ist (nahtlos). Ohne Plugin: /server survival bzw. reconnect.
	try = ["survival", "limbo"]

[forced-hosts]

[advanced]
	compression-threshold = 256
	compression-level = -1
	login-ratelimit = 3000
	connection-timeout = 5000
	read-timeout = 30000
	haproxy-protocol = false
	tcp-fast-open = false
	bungee-plugin-message-channel = true
	show-ping-requests = false
	failover-on-unexpected-server-disconnect = true
	announce-proxy-commands = true
	log-command-executions = false
	log-player-connections = true
	# 1.20.5+ Transfer-Pakete annehmen (unkritisch, zukunftssicher).
	accepts-transfers = true

[query]
	enabled = false
	port = 25565
	map = "Greenleaf"
	show-plugins = false

[packet-limiter]
	interval = 7
	packets-per-second = -1
	bytes-per-second = -1
	decompressed-bytes-per-second = 5242880
