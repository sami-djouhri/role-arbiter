# ABGELOEST seit 2026-08-10 — NICHT MEHR AKTIV. Die laufende Proxyschicht ist
# docker-compose.velocity.yml (Velocity 4 + NanoLimbo, "Weg B"); deploy.sh rollt diese aus.
# Diese Datei bleibt nur als Rueckfallebene liegen. Wer sie ausrollt, kappt den oeffentlichen
# Zugang, weil sie die Velocity-/Limbo-Container nicht kennt.
#
# Historisch: Gate (Lite) + Connect vor dem Paper-Backend.
# Gate ist leichtgewichtig + IMMER up und haelt den oeffentlichen Connect-Tunnel, auch
# waehrend mc-poc schlaeft. Das Paper-Backend (mc-poc) wird NICHT mehr von einem Proxy
# spielergetrieben gestartet, sondern vom mc-arbiter/Orchestrator (RAM-Prio: MC <-> Win-Lab).
# Ersetzt docker-compose.lazymc.yml. RCON-pw wird beim Deploy aus /opt/mc/.rcon injiziert.
networks:
  mc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16          # explizit (CLAUDE.md-Regel), statische IPs fuers Backend-Routing
services:
  gate:
    image: ghcr.io/minekube/gate:latest
    container_name: mc-gate
    restart: unless-stopped
    working_dir: /gate-data              # config.yml (./config.yml) + connect.json landen hier -> persistent
    networks:
      mc-net: { ipv4_address: 172.30.0.2 }
    volumes:
      - ./gate:/gate-data                # config.yml (ro-genutzt) + connect.json (Token, wird geschrieben)
    ports:
      - "192.0.2.10:25565:25565"       # LAN-Zugang; oeffentlich laeuft ueber den Connect-Tunnel (outbound)
  mc:
    image: itzg/minecraft-server:java25   # Paper MC 26.1 braucht Java 25
    container_name: mc-poc
    stop_grace_period: 60s                # Paper sauber alle Welten speichern lassen (sonst SIGKILL=137 im Save)
    networks:
      mc-net: { ipv4_address: 172.30.0.3 }
    tty: true
    stdin_open: true
    restart: "no"                         # Orchestrator steuert Start/Stop/Heilung, kein Docker-Restart-Sturm
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      MEMORY: "2000M"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_PLAYERS: "8"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"            # Grief-Backstop; Welt-Design (Farmwelt-Reset/Claim) ergaenzt Punkt 5
      ENABLE_RCON: "true"
      RCON_PASSWORD: "__RCONPW__"         # Platzhalter -> deploy aus /opt/mc/.rcon
      SPARK: "true"
      MODRINTH_PROJECTS: "chunky,multiverse-core"
      ENABLE_AUTOSTOP: "FALSE"            # Idle-/Lifecycle-Logik macht der Orchestrator, nicht itzg
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data
